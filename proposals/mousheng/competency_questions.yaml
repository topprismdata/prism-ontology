# ==============================================================================
# competency_questions.yaml
# 谋圣·售点洞察 (mousheng-outlet-insight) - 核心业务问题集 (Competency Questions)
#
# 评估原则：
# 1. semantic_expressibility: 该业务问题能否完全被 prism-ontology 语义模型结构化表达 (pass / fail)
# 2. data_answerability: 当前物理数据集是否有足够字段支持完整计算回答 (full / partial / none)
# 3. 若 data_answerability 为 partial 或 none，必须显式声明 blocking_reason 和 handling_policy，绝不伪造数据结论
# ==============================================================================

version: "1.0.0"
governance_status: "verified"

competency_questions:
  # ----------------------------------------------------------------------------
  # 场景 1: 指定品牌和区域的门店清单
  # ----------------------------------------------------------------------------
  - id: "CQ-001"
    scenario: "指定品牌与区域清单"
    natural_language: "浦西大区的美宜佳清单"
    target_ontology_intent: "prism:intent/PointExtraction"
    target_entities: ["prism:outlet/Brand:美宜佳", "prism:outlet/Territory:浦西大区"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "execute_direct_query"

  # ----------------------------------------------------------------------------
  # 场景 2: 指定区域的业态分布
  # ----------------------------------------------------------------------------
  - id: "CQ-002"
    scenario: "区域业态结构分布"
    natural_language: "江苏省各业态的售点数量分布"
    target_ontology_intent: "prism:intent/DistributionAnalysis"
    target_entities: ["prism:outlet/AdministrativeRegion:江苏省", "prism:outlet/ChannelType"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "execute_aggregation_and_structure_synthesis"

  # ----------------------------------------------------------------------------
  # 场景 3: 指定业态的品牌格局与集中度
  # ----------------------------------------------------------------------------
  - id: "CQ-003"
    scenario: "业态品牌集中度"
    natural_language: "上海城区餐饮连锁品牌的集中度与头部排行"
    target_ontology_intent: "prism:intent/ConcentrationAnalysis"
    target_entities: ["prism:outlet/AdministrativeRegion:上海城区", "prism:outlet/ChannelType:餐饮", "prism:outlet/Brand"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "calculate_hhi_cr4_and_distribution"

  # ----------------------------------------------------------------------------
  # 场景 4: 跨区域群体指标对比
  # ----------------------------------------------------------------------------
  - id: "CQ-004"
    scenario: "群体同态指标对比"
    natural_language: "浦东大区与浦西大区在食杂店平均客流上的差异"
    target_ontology_intent: "prism:intent/GroupComparison"
    target_entities: ["prism:outlet/Territory:浦东大区", "prism:outlet/Territory:浦西大区", "prism:outlet/ChannelType:食杂"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "calculate_difference_and_significance"

  # ----------------------------------------------------------------------------
  # 场景 5: 用户复合规则下的候选评估
  # ----------------------------------------------------------------------------
  - id: "CQ-005"
    scenario: "多因子规则符合度评估"
    natural_language: "餐饮街门店数≥20家，周末客流排序，评分3.8占比超50%的街道候选"
    target_ontology_intent: "prism:intent/RuleEvaluation"
    target_entities: ["prism:outlet/CommercialSite:餐饮街"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "evaluate_rule_compliance_matrix"

  # ----------------------------------------------------------------------------
  # 场景 6: 指标冲突与异动检测 (前沿能力)
  # ----------------------------------------------------------------------------
  - id: "CQ-006"
    scenario: "多维指标背离检测"
    natural_language: "哪些商圈存在高客流但大众点评评分显著偏低的背离现象？"
    target_ontology_intent: "prism:intent/AnomalyDetection"
    target_entities: ["prism:outlet/CommercialSite", "prism:metric/WeekendTraffic", "prism:metric/DianpingRating"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "cross_quantile_discrepancy_scan"

  # ----------------------------------------------------------------------------
  # 场景 7: 数据质量与覆盖率不足检测
  # ----------------------------------------------------------------------------
  - id: "CQ-007"
    scenario: "数据稀疏度质检"
    natural_language: "景区周边客栈的客房数与星级分布"
    target_ontology_intent: "prism:intent/QualityGatedAnalysis"
    target_entities: ["prism:outlet/CommercialSite:景区周边", "prism:outlet/ChannelType:住宿"]
    semantic_expressibility: "pass"
    data_answerability: "partial"
    blocking_reason: "部分非标小微客栈缺少携程星级数据（缺失率 > 65%）"
    handling_policy: "output_quality_warning_and_degrade_confidence_to_low"

  # ----------------------------------------------------------------------------
  # 场景 8: 竞品真实销量份额分析 (明确标注不可回答)
  # ----------------------------------------------------------------------------
  - id: "CQ-008"
    scenario: "外部竞品销量份额"
    natural_language: "可口可乐 vs 百事可乐在华东食杂店的真实销售箱数份额"
    target_ontology_intent: "prism:intent/MarketShareAnalysis"
    target_entities: ["prism:outlet/ChannelType:食杂", "prism:outlet/Brand:可口可乐", "prism:outlet/Brand:百事可乐"]
    semantic_expressibility: "pass"
    data_answerability: "none"
    blocking_reason: "当前售点洞察宽表仅含售点自身静态画像，未包含竞品在途销量 POS/开箱数据"
    handling_policy: "strictly_reject_calculation_and_explain_limitation"

  # ----------------------------------------------------------------------------
  # 场景 9: 汇总结果下钻至具体门店
  # ----------------------------------------------------------------------------
  - id: "CQ-009"
    scenario: "统计到明细下钻"
    natural_language: "看排第一的瑞幸咖啡在上海城区的具体门店清单"
    target_ontology_intent: "prism:intent/DrilldownExtraction"
    target_entities: ["prism:outlet/Brand:瑞幸咖啡", "prism:outlet/AdministrativeRegion:上海城区"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "retrieve_raw_outlet_records_by_drill_key"

  # ----------------------------------------------------------------------------
  # 场景 10: 多形态视觉证据生成
  # ----------------------------------------------------------------------------
  - id: "CQ-010"
    scenario: "图表与视觉证据对齐"
    natural_language: "生成上海市餐饮连锁品牌 TOP20 的门店数与评分双轴图"
    target_ontology_intent: "prism:intent/VisualEvidenceGeneration"
    target_entities: ["prism:outlet/AdministrativeRegion:上海城区", "prism:outlet/ChannelType:餐饮"]
    semantic_expressibility: "pass"
    data_answerability: "full"
    blocking_reason: null
    handling_policy: "render_flint_combo_chart_with_consistent_analysis_id"
