version: 2.1.0
governance_model: prism-ontology-three-layer
dataset:
  name: sh-store-insight-152
  description: 华东大区售点洞察全量宽表（152列完整七类结构化模式映射）
  physical_schema_columns: 152
  runtime_analysis_frame_columns: 153
  total_governance_mapping_records: 153
  governance_status: verified_seven_class_pattern_complete
field_classes:
- id: entity_identity
  name: 核心实体身份与生命周期字段
  description: 售点、品牌、场所等客观实体的多方案标识 Scheme 与名称地址及上线建档时间
- id: classification_and_role
  name: 分类与角色关系字段
  description: 业态分类、品牌归属及特定组织视角下的服务关系状态
- id: spatial_and_territory
  name: 空间与责任区域字段
  description: 行政区划 (AdministrativeRegion) 与销售辖区 (Territory) 严格双轨制
- id: external_observation
  name: 外部平台客观观察字段
  description: 大众点评、携程、高德、客流人口、实体匹配质检等多源动态观测事实
- id: derived_estimate
  name: 派生推导与预测估计字段
  description: 潜力模型、开店年限等算法推导与估计属性
- id: ambiguous_isolated
  name: 临时业务标签与歧义字段
  description: 含义不清或实验标签，显式隔离禁止进入执行
- id: engineering_provenance
  name: 数据工程与血缘溯源字段
  description: ETL 管道、数据质量与日志列，不进入业务语义
